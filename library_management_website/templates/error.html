{% extends 'base.html' %}
{% block title %}{{ code }} · Page Not Found{% endblock %}
{% block content %}
<section class="error-page-section">
  <div class="error-card">
    <div class="error-illustration-wrapper">
      <div class="error-book-icon" aria-hidden="true">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
          <line x1="9" y1="9" x2="9.01" y2="9"/>
          <line x1="15" y1="9" x2="15.01" y2="9"/>
          <path d="M10 14c1-1 3-1 4 0"/>
        </svg>
      </div>
      <span class="error-status-tag">{{ code }} ERROR</span>
    </div>

    <h1 class="error-heading">This chapter seems to be missing.</h1>
    <p class="error-submessage">{{ message }}</p>

    <div class="error-actions">
      <a class="button button-primary button-large" href="{{ url_for('index') }}">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        <span>Back to the Shelves</span>
      </a>
      {% if current_user.is_authenticated %}
      <a class="button button-outline" href="{{ url_for('my_loans') }}">
        <span>My Bookshelf</span>
      </a>
      {% endif %}
    </div>
  </div>
</section>
{% endblock %}
